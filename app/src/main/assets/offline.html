<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SirDaba — لا يوجد اتصال</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A0A0A;
    color: #fff;
    font-family: 'Cairo', 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, #1c1c1c, #2a2a2a);
    border-radius: 24px;
    border: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #F97316, #FBBF24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    color: #64748b;
    font-size: 14px;
    line-height: 1.8;
    max-width: 280px;
    margin: 0 auto 32px;
  }
  button {
    background: linear-gradient(135deg, #F97316, #EA580C);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(249,115,22,0.35);
  }
  button:active { transform: scale(0.97); }
  .dots { display: flex; gap: 8px; margin-bottom: 40px; }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #F97316;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; background: #FBBF24; }
  .dot:nth-child(3) { animation-delay: 0.4s; background: #16A34A; }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تعذر الاتصال بـ SirDaba Delivery.<br>تحقق من اتصالك بالإنترنت وحاول مجدداً.</p>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <button onclick="window.location.reload()">🔄 إعادة المحاولة</button>
</body>
</html>
